<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1530">
  <meta name="description" content="Aya's Valentines, one for every year.">
  <title>Aya's Valentines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Gloock&family=Italiana&display=swap" rel="stylesheet">
  <style>
    :root { --cherry: #8f0e2a; --wine: #5c0618; --blush: #ffd9df; --paper: #fff4f2; --night: #0b1530; --deep: #060c1f; --star: #ffe2a3; --moon: #f5eedf; --ease-out: cubic-bezier(0.16, 1, 0.3, 1); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 500 17px/1.5 "Figtree", system-ui, sans-serif; background: var(--night); -webkit-font-smoothing: antialiased; }
    .split { min-height: 100%; display: grid; grid-template-columns: 1fr 1fr; }
    h1 { position: absolute; z-index: 2; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); margin: 0; padding: 8px 18px; border-radius: 999px; background: rgba(0, 0, 0, 0.28); color: #fff; font: 600 15px/1.2 "Figtree", sans-serif; white-space: nowrap; }
    .year { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 32px max(5vw, 20px) max(48px, env(safe-area-inset-bottom)); text-decoration: none; overflow: hidden; }
    .y26 { background: radial-gradient(120% 90% at 30% 40%, #a3132f 0%, var(--cherry) 50%, var(--wine) 100%); color: var(--paper); }
    .y27 { background: radial-gradient(130% 100% at 70% 30%, #1a2a5c 0%, var(--night) 50%, var(--deep) 100%); color: var(--moon); }
    .num { font-size: clamp(88px, 14vw, 220px); line-height: 0.85; letter-spacing: -0.03em; transition: transform 300ms var(--ease-out); transform-origin: left bottom; }
    .y26 .num { font-family: "Gloock", Georgia, serif; }
    .y27 .num { font-family: "Italiana", Georgia, serif; color: var(--star); }
    .sub { font-size: clamp(18px, 2vw, 22px); opacity: 0.85; transition: opacity 150ms var(--ease-out); }
    .year:hover .num, .year:focus-visible .num { transform: scale(1.03); }
    .year:hover .sub { opacity: 1; }
    .year:focus-visible { outline: 3px solid var(--star); outline-offset: -6px; }
    .badge { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: var(--star); color: var(--night); font-weight: 600; font-size: 14px; }
    .dots { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7), transparent), radial-gradient(1px 1px at 70% 20%, rgba(255,226,163,.8), transparent), radial-gradient(1.5px 1.5px at 40% 60%, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,.5), transparent), radial-gradient(1px 1px at 60% 80%, rgba(255,226,163,.6), transparent), radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,.5), transparent), radial-gradient(1.5px 1.5px at 90% 85%, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 35% 15%, rgba(255,255,255,.6), transparent); }
    @media (max-width: 700px) { .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; min-height: 100svh; } .year { padding-bottom: 28px; } h1 { top: max(12px, env(safe-area-inset-top)); } }
    @media (prefers-reduced-motion: reduce) { .num, .sub { transition: none; } }
  </style>
</head>
<body>
  <main class="split">
    <h1>Aya's Valentines</h1>
    <a class="year y26" href="2026/">
      <span class="num">2026</span>
      <span class="sub">Will you be my Valentine?</span>
    </a>
    <a class="year y27" href="2027/">
      <span class="dots" aria-hidden="true"></span>
      <span class="badge">New</span>
      <span class="num">2027</span>
      <span class="sub">Our second Valentine's, twelve stars for you</span>
    </a>
  </main>
</body>
</html>
